name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB:       sg_test
          POSTGRES_USER:     sg
          POSTGRES_PASSWORD: sg_test_pass
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV:                 test
      DATABASE_URL:             postgres://sg:sg_test_pass@localhost:5432/sg_test
      REDIS_HOST:               localhost
      REDIS_PORT:               6379
      ACCESS_TOKEN_SECRET_KEY:  ci-access-secret
      REFRESH_TOKEN_SECRET_KEY: ci-refresh-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        run: cd backend && npm ci

      - name: Run migrations
        run: cd backend && npm run migrate

      - name: Run tests
        run: cd backend && npm test --if-present
